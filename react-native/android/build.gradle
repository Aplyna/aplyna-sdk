buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath "com.android.tools.build:gradle:8.9.1"; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20" }
}
apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react { jsRootDir = file("../src"); libraryName = "AplynaSpec"; codegenJavaPackageName = "com.aplyna.reactnative" }
android {
    namespace "com.aplyna.reactnative"
    compileSdk 35
    defaultConfig { minSdk 24 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
}
repositories { google(); mavenCentral() }
dependencies {
    implementation "com.facebook.react:react-android"
    implementation "com.android.billingclient:billing:9.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}
